# ============================================================
# Cloud Lib — GitHub Actions CI/CD Pipeline
# Triggered on every push to the `main` branch
#
# Required GitHub Secrets (set in repo Settings > Secrets):
#   AWS_ACCESS_KEY_ID         — IAM user with S3/EB/CloudFront access
#   AWS_SECRET_ACCESS_KEY     — IAM user secret key
#   AWS_REGION                — e.g. ap-southeast-1
#   S3_BUCKET_FRONTEND        — S3 bucket name for React build
#   CLOUDFRONT_DISTRIBUTION_ID — CloudFront distribution ID
#   EB_APPLICATION_NAME       — Elastic Beanstalk application name
#   EB_ENVIRONMENT_NAME       — Elastic Beanstalk environment name
#   S3_BUCKET_EB_DEPLOY       — S3 bucket for EB deployment packages
#   VITE_API_BASE_URL         — Public Elastic Beanstalk URL
# ============================================================
name: Deploy Cloud Lib to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:       # allow manual triggers from GitHub UI

env:
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Test & Build
  # ──────────────────────────────────────────────────────────
  build:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Backend ───────────────────────────────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # ── Frontend ──────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend (production)
        working-directory: frontend
        env:
          # Inject the EB endpoint so Vite embeds it in the bundle
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      # ── Upload build artifacts ────────────────────────────
      - name: Upload frontend dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

      - name: Upload backend source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-source
          path: |
            backend/
            !backend/node_modules/
            !backend/.env
          retention-days: 1

  # ──────────────────────────────────────────────────────────
  # JOB 2: Deploy Frontend to S3 + CloudFront
  # ──────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Sync dist/ to S3 bucket
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_FRONTEND }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"
          # HTML files should NOT be cached aggressively
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_FRONTEND }} \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # ──────────────────────────────────────────────────────────
  # JOB 3: Deploy Backend to Elastic Beanstalk
  # ──────────────────────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend (Elastic Beanstalk)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download backend source artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-source
          path: backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Install backend production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Create deployment zip package
        run: |
          cd backend
          zip -r ../cloudlib-backend-${{ github.sha }}.zip . \
            --exclude ".git/*" \
            --exclude ".env" \
            --exclude "*.test.js"

      - name: Upload deployment package to S3
        run: |
          aws s3 cp cloudlib-backend-${{ github.sha }}.zip \
            s3://${{ secrets.S3_BUCKET_EB_DEPLOY }}/cloudlib-backend-${{ github.sha }}.zip

      - name: Create new Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.EB_APPLICATION_NAME }}" \
            --version-label "v-${{ github.sha }}" \
            --description "Deployed from GitHub Actions — commit ${{ github.sha }}" \
            --source-bundle S3Bucket="${{ secrets.S3_BUCKET_EB_DEPLOY }}",S3Key="cloudlib-backend-${{ github.sha }}.zip" \
            --auto-create-application

      - name: Deploy new version to Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "${{ secrets.EB_APPLICATION_NAME }}" \
            --environment-name "${{ secrets.EB_ENVIRONMENT_NAME }}" \
            --version-label "v-${{ github.sha }}"

      - name: Wait for environment to become healthy
        run: |
          echo "Waiting for Elastic Beanstalk environment to be Ready..."
          aws elasticbeanstalk wait environment-updated \
            --application-name "${{ secrets.EB_APPLICATION_NAME }}" \
            --environment-name "${{ secrets.EB_ENVIRONMENT_NAME }}" \
            --version-label "v-${{ github.sha }}"
          echo "✅ Deployment complete!"
