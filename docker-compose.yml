# ============================================================
# Cloud Lib — Docker Compose (Local Full-Stack Testing)
# Mirrors the AWS production environment locally before deploy
# Usage:
#   docker compose up --build
#   docker compose down -v   (removes volumes/data)
# ============================================================

version: '3.9'

services:

  # ── MySQL Database ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: cloudlib-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cloud_lib
      MYSQL_USER: cloudlib_user
      MYSQL_PASSWORD: cloudlib_pass
    ports:
      - "3306:3306"
    volumes:
      # Persist data across restarts
      - db_data:/var/lib/mysql
      # Run schema on first startup
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Node.js Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudlib-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: cloudlib_user
      DB_PASSWORD: cloudlib_pass
      DB_NAME: cloud_lib
      JWT_SECRET: local_docker_jwt_secret_replace_in_production
      FRONTEND_URL: http://localhost:5173
      # AWS SNS — leave blank for local (simulated)
      AWS_REGION: ap-southeast-1
      SNS_TOPIC_ARN: ""
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── React Frontend (production build served by nginx) ──────
  frontend:
    image: nginx:alpine
    container_name: cloudlib-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      # Mount the Vite production build output
      - ./frontend/dist:/usr/share/nginx/html:ro
      # Custom nginx config that proxies /api to backend
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  db_data:
    name: cloudlib_db_data
